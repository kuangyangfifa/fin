{% extends "base.html" %}

{% block title %}修改密码 - {{ APP_NAME }}{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item active">修改密码</li>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="form-card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-2 rounded me-3">
                            <i class="bi bi-key text-primary fs-4"></i>
                        </div>
                        <h5 class="mb-0">修改密码</h5>
                    </div>
                </div>
                <div class="card-body px-4 pb-4">
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
                        <div class="mb-3">
                            <label for="old_password" class="form-label">当前密码</label>
                            <input type="password" class="form-control" id="old_password" name="old_password" required>
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">新密码</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                        </div>
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">确认新密码</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
                        </div>
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary flex-grow-1">保存修改</button>
                            <a href="{{ url_for('main.index') }}" class="btn btn-light">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
